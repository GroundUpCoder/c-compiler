<!DOCTYPE html>
<!-- Demo 2 of the gucOS NetSurf JavaScript ladder (todos/NETSURF-JS.md §6).
     Needs: click dispatch to JS + a mutation channel that actually REPAINTS.
     Form-control value is such a channel (html/dom_event.c syncs the gadget
     and redraws its box); structural DOM edits are NOT, until the
     mutation->reflow bridge lands, which is why the readout here is an
     <input> and not a <span>. -->
<html>
<head>
<title>Counter</title>
<style>
body { font-family: sans-serif; margin: 1.5em; }
h1 { font-size: 1.4em; }
#n { font-size: 1.2em; text-align: right; }
button { font-size: 1.1em; padding: 0.2em 0.9em; }
.note { color: #555; font-size: 0.9em; margin-top: 1.4em; }
</style>
</head>
<body>
<h1>Counter</h1>

<p>
<input id="n" type="text" size="8" value="0" readonly>
<button id="inc">Add one</button>
<button id="dec">Take one</button>
<button id="zero">Reset</button>
</p>

<script>
var out = document.getElementById('n');

function show(v) {
	/* Writing a form control's value is the repainting mutation channel. */
	out.value = v;
}

function bump(by) {
	var v = parseInt(out.value, 10);
	if (isNaN(v)) {
		v = 0;
	}
	show(by === 0 ? 0 : v + by);
}

document.getElementById('inc').addEventListener('click', function () { bump(1); });
document.getElementById('dec').addEventListener('click', function () { bump(-1); });
document.getElementById('zero').addEventListener('click', function () { bump(0); });

console.log('counter ready');
</script>

<p class="note">Each button is a real DOM <code>click</code> listener.  The
number is redrawn by the browser as soon as the handler assigns to
<code>input.value</code> &mdash; no reload, no user redraw.</p>
</body>
</html>
