<!DOCTYPE html>
<!-- Demo 1 of the gucOS NetSurf JavaScript ladder (todos/NETSURF-JS.md §6).
     Needs: JS engine + console + parse-time document.write.  Nothing else. -->
<html>
<head>
<title>Hello JavaScript</title>
<style>
body { font-family: sans-serif; margin: 1.5em; }
h1 { font-size: 1.4em; }
#out { border: 1px solid #888; padding: 0.6em; background: #f4f4f4; }
.note { color: #555; font-size: 0.9em; }
</style>
</head>
<body>
<h1>Hello JavaScript</h1>

<p>The paragraph below was not in the HTML.  It was computed by a script and
written into the document while the page was still being parsed.</p>

<div id="out">
<script>
var powers = [];
for (var i = 1; i <= 8; i *= 2) {
	powers.push(i);
}
document.write('<p>2^0..2^3 doubled: ' + powers.join(', ') +
	       ' &mdash; sum ' + (powers[0] + powers[1] + powers[2] + powers[3]) +
	       '</p>');
document.write('<p>document.write ran at parse time, ' +
	       new Date().getFullYear() + '</p>');
console.log('hello from JavaScript');
console.log('engine reached the end of the script');
</script>
</div>

<p class="note">Open the console output (monkey: <code>WINDOW CONSOLE_LOG</code>)
to see the two log lines this page emits.</p>
</body>
</html>
