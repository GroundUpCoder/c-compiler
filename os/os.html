<!DOCTYPE html>
<!-- os.html — the reference OS page (todos/0004; design: todos/OS.md
     "Reference build"). Deliberately a dumb UI bridge: xterm renders bytes,
     keystrokes go to the kernel worker, and EVERYTHING with logic lives in
     kernel.js / host.js / os-common.js so it stays testable under Node
     (os/boot.js is the same OS with the tty on stdio).

     VTs (todos/0022, Linux-console semantics): the xterm tty is VT1, the
     desktop VT2 — the page shows exactly one at a time, switched with the
     Terminal/Desktop TAB BAR at the top (the discoverable, primary
     affordance; Ctrl+Alt+F1/F2 and Ctrl+Alt+1/2 remain as aliases). Boot
     STREAMS on VT1 (the log stays visible), then a healthy boot lands on
     VT2 — the desktop is the default tab (todos/0070); boot-error and
     halt force VT1, and a manual switch during boot wins. The point is
     availability under partial failure: VT1's
     path is kernel worker + xterm only — no compositor, no wm — so the
     shell stays usable while the desktop is broken or merely suspect.
     (Boot itself requires WebGPU since todos/0055 — the boot-nogpu guard
     below; a tty-only no-GPU boot was considered and rejected there.)
     Pure page-side state; the kernel keeps compositing while hidden
     (mailbox frames, bounded cost).

     Serve from the repo root — SharedArrayBuffer needs the COOP/COEP
     headers serve.js sends:   node serve.js .   then open /os/os.html  -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>gucOS</title>
<link rel="stylesheet" href="../vendor/xterm/xterm.css">
<style>
  html, body { height: 100%; margin: 0; background: #0d0d1a; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #status {
    font: 12px 'Menlo', 'Consolas', monospace; color: #557755;
    padding: 2px 8px; white-space: nowrap; overflow: hidden;
  }
  #status.error { color: #cc5555; }
  /* VT tabs (todos/0022): the primary, discoverable switch — one tab per
     VT, browser-tab styling. Ctrl+Alt+F1/F2 (or 1/2) are quiet aliases. */
  #vtbar {
    display: flex; gap: 2px; padding: 6px 8px 0;
    border-bottom: 1px solid #333355;
  }
  .vttab {
    font: 12px 'Menlo', 'Consolas', monospace; color: #8888a8;
    cursor: pointer; user-select: none; padding: 5px 18px;
    background: #16162a; border: 1px solid #333355; border-bottom: none;
    border-radius: 6px 6px 0 0; position: relative; top: 1px;
  }
  .vttab:hover { color: #c0c0d8; }
  .vttab.active {
    color: #e0e0f0; background: #22223a; border-color: #4a4a77;
  }
  /* OSK toggle (mobile OSK): visible on BOTH VTs and NOT gated on
     data-touchui — it costs nothing on desktop, stays drivable in tests,
     and mouse users can use it too. It heads the tab bar's right cluster,
     so it carries the auto margin (fontctl/zoomctl follow it). */
  #oskbtn { margin-left: auto; }
  #oskbtn.on { background: #4a4a77; color: #ffffff; }
  /* VT1 font-size steps (todos/0212): right-aligned in the tab bar, only
     meaningful while the tty is visible. */
  #fontctl { display: flex; gap: 2px; }
  body[data-vt="2"] #fontctl { display: none; }
  .fontbtn {
    font: 12px 'Menlo', 'Consolas', monospace; color: #8888a8;
    cursor: pointer; user-select: none; -webkit-user-select: none;
    padding: 5px 12px; background: #16162a; border: 1px solid #333355;
    border-bottom: none; border-radius: 6px 6px 0 0;
    position: relative; top: 1px;
  }
  .fontbtn:hover { color: #c0c0d8; }
  /* VT2 desktop zoom (integer downscale): only meaningful while the desktop
     is visible, and touch-gated (a non-touch desktop keeps Z=1). */
  #zoomctl { display: none; gap: 2px; }
  body[data-vt="2"][data-touchui] #zoomctl { display: flex; }
  /* "Desktop site" toggle (#69 D6): the standard mobile-browser affordance —
     opt out of the auto-2× mobile default back to the unzoomed 1× desktop
     (and back). Same visibility gate as the zoom control it drives. */
  #desksite { display: none; }
  body[data-vt="2"][data-touchui] #desksite { display: inline-block; }
  #desksite.on { background: #4a4a77; color: #ffffff; }
  .fontlabel {
    font: 12px 'Menlo', 'Consolas', monospace; color: #8888a8;
    padding: 5px 6px; user-select: none; -webkit-user-select: none;
    align-self: center; min-width: 20px; text-align: center;
  }
  /* Mobile key strip (todos/0212): tty keys a soft keyboard lacks. Shown
     only on VT1 and only on a touch/narrow UI (data-touchui, set by JS). */
  #keystrip { display: none; gap: 4px; padding: 4px 8px 6px; flex-wrap: wrap; }
  body[data-vt="1"][data-touchui] #keystrip { display: flex; }
  .stripkey {
    font: 13px 'Menlo', 'Consolas', monospace; color: #c0c0d8;
    background: #16162a; border: 1px solid #333355; border-radius: 5px;
    padding: 7px 0; width: 44px; text-align: center; cursor: pointer;
    user-select: none; -webkit-user-select: none;
  }
  .stripkey:hover { color: #e0e0f0; border-color: #4a4a77; }
  .stripkey.armed { background: #4a4a77; color: #ffffff; }
  /* On-screen keyboard (mobile OSK, os/osk.js): a flex SIBLING of the VT
     panes at its NATURAL layout height — opening it shrinks the flex:1 pane
     above it, which on VT2 flows through syncScreenSize -> screen-resize ->
     the wm re-lays the taskbar and re-clamps windows (occlusion solved by
     the 0023 dynamic screen; composes with zoom's floor(pane/Z) for free).
     touch-action none: the OSK owns its touches (no browser gestures). */
  #osk { display: none; padding: 2px 6px 6px; touch-action: none;
         user-select: none; -webkit-user-select: none; }
  body[data-osk] #osk { display: block; }
  body[data-guard] #osk { display: none; }
  /* The OSK supersedes the 0212 keystrip while open (it is a superset).
     The full attribute chain out-specifies the keystrip's show rule. */
  body[data-osk][data-vt="1"][data-touchui] #keystrip { display: none; }
  .oskin { max-width: 760px; margin: 0 auto; }
  .oskrow { display: flex; gap: 4px; margin-top: 4px; }
  .oskkey {
    flex: 1 1 0; min-width: 0; overflow: hidden; white-space: nowrap;
    /* Bigger, touch-friendly keys: font + vertical padding scale up with the
       viewport (clamp) so a ~390px phone gets ~44px-tall targets while large
       screens stay reasonable. Horizontal padding stays 0 so the flex row
       (flex 1 1 0) shares width evenly and never overflows. */
    font-family: 'Menlo', 'Consolas', monospace;
    font-size: clamp(15px, 4vw, 17px); line-height: 1.25; color: #c0c0d8;
    background: #16162a; border: 1px solid #333355; border-radius: 5px;
    padding: clamp(11px, 3.2vw, 14px) 0; text-align: center; cursor: pointer;
    user-select: none; -webkit-user-select: none;
  }
  .oskkey:hover { color: #e0e0f0; border-color: #4a4a77; }
  .oskkey.armed { background: #4a4a77; color: #ffffff; }
  .oskkey.locked { background: #6a6ab7; color: #ffffff; border-color: #9a9ad7; }
  /* On narrow phones, reclaim the side padding so the board uses full viewport
     width (the .oskin 760px cap only bites on tablets/desktop). */
  @media (max-width: 480px) { #osk { padding: 2px 2px 6px; } }
  /* The desktop (todos/WM.md): the kernel composites windows onto this
     canvas in its worker; the page only forwards raw input. At zoom Z=1 the
     canvas is natural-size (backing store == pane == CSS size), so event
     offsets equal screen coordinates. At Z>1 (VT2 desktop zoom) the backing
     store shrinks to floor(pane/Z) while the CSS display size is pinned to
     the full pane, so the render stays 1 logical px = 1 screen px and only
     the page's pointer seam divides CSS coords by Z (see syncScreenSize /
     mapX). image-rendering:pixelated makes the integer upscale crisp NxN
     blocks (nearest-neighbor) — integer scale + pixelated = zero blur, which
     is the whole reason zoom is integer-only. overflow hidden covers the
     resize transient while the worker's canvas commit lags the layout. */
  #desktop { flex: 1; min-height: 0; display: flex; justify-content: center;
             align-items: center; background: #06131a; overflow: hidden; }
  /* Host-file drop target highlight (todos/0067): while a drag hovers the
     desktop pane, an inset ring says "this lands in ~/Desktop". */
  #desktop.droptarget { box-shadow: inset 0 0 0 3px #5599dd; }
  /* touch-action none (todos/0212): the touch layer below owns every touch
     gesture on the desktop canvas — no browser scroll/double-tap-zoom. */
  #screen { outline: none; display: block; touch-action: none;
            image-rendering: pixelated; }
  #terminal { flex: 1; min-height: 0; padding: 4px; }
  /* VTs: exactly one of tty/desktop is visible (todos/0022). */
  body[data-vt="1"] #desktop { display: none; }
  body[data-vt="2"] #terminal { display: none; }
  /* Boot guard screen — two-tab lock (todos/0045: retry re-attempts) and
     the WebGPU requirement (todos/0055: no retry — the compositor IS
     WebGPU, no fallback) — shown INSTEAD of the VT panes. */
  #guard { flex: 1; display: none; flex-direction: column; gap: 14px;
           align-items: center; justify-content: center; text-align: center;
           font: 14px 'Menlo', 'Consolas', monospace; color: #c0c0d8; }
  #guard button {
    font: 13px 'Menlo', 'Consolas', monospace; color: #e0e0f0;
    background: #22223a; border: 1px solid #4a4a77; border-radius: 6px;
    padding: 6px 22px; cursor: pointer;
  }
  #guard button:hover { background: #2c2c4a; border-color: #6a6aa7; }
  body[data-guard] #guard { display: flex; }
  body[data-guard] #vtbar, body[data-guard] #terminal,
  body[data-guard] #desktop { display: none; }
</style>
</head>
<body data-vt="1">
<div id="wrap">
  <div id="vtbar">
    <span id="vt1tab" class="vttab active" title="the tty, VT1 (Ctrl+Alt+F1)">Terminal</span>
    <span id="vt2tab" class="vttab" title="the desktop, VT2 (Ctrl+Alt+F2). Ctrl+Alt+Tab cycles windows, +Shift for previous (todos/0032); Ctrl+Esc opens the Start menu (todos/0078)">Desktop</span>
    <span id="oskbtn" class="fontbtn" title="on-screen keyboard">&#9000;</span>
    <span id="fontctl" title="terminal font size">
      <span id="fontminus" class="fontbtn">A&minus;</span><span id="fontplus" class="fontbtn">A+</span>
    </span>
    <span id="zoomctl" title="desktop zoom (integer, crisp)">
      <span id="zoomminus" class="fontbtn">&minus;</span><span id="zoomlabel" class="fontlabel">1&times;</span><span id="zoomplus" class="fontbtn">+</span>
    </span>
    <span id="desksite" class="fontbtn" title="desktop site: the unzoomed 1&times; desktop (tap again for the 2&times; mobile zoom)">Desktop site</span>
  </div>
  <div id="desktop"><canvas id="screen" width="800" height="500" tabindex="0"></canvas></div>
  <div id="terminal"></div>
  <div id="keystrip"></div>
  <div id="osk"></div>
  <div id="guard">
    <div id="guardMsg">gucOS is already running in another tab.<br>
         Close that tab, then retry — the lock frees when it closes.</div>
    <button id="guardRetry">Retry</button>
  </div>
  <div id="status">booting…</div>
</div>
<script src="../vendor/xterm/xterm.js"></script>
<script src="../vendor/xterm/xterm-addon-fit.js"></script>
<!-- host.js on the page ONLY for createAudioReceiver (todos/0017): the
     mixer's output ring plays through the same Web Audio path standalone
     pages use. The page stays a dumb bridge — no other host.js use here. -->
<script src="../host.js"></script>
<!-- The on-screen keyboard component (mobile OSK) — page-side only. -->
<script src="osk.js"></script>
<script>
'use strict';

var statusEl = document.getElementById('status');
function status(msg, isError) {
  statusEl.textContent = msg;
  statusEl.className = isError ? 'error' : '';
}

if (typeof SharedArrayBuffer === 'undefined') {
  status('SharedArrayBuffer unavailable — serve this page with COOP/COEP headers (node serve.js .)', true);
  throw new Error('no SAB');
}

// The phone-shaped-viewport predicate: the auto-default signal shared by the
// VT1 font bump (todos/0212) and the VT2 zoom default (#69 D6). Deliberately
// NARROWER than touchUiSync's touch-or-narrow predicate — a touch-capable
// wide viewport (a tablet, a touchscreen laptop) gets the mobile CONTROLS
// but keeps desktop-density defaults; only a viewport that is actually
// phone-sized gets bigger-by-default. Explicit choices always override.
function mobileViewport() {
  return Math.min(window.innerWidth, window.innerHeight) <= 700;
}

// VT1 font-size steps (todos/0212): an explicit choice persists in
// localStorage; with nothing stored, a narrow (phone-shaped) viewport
// defaults one step larger than the desktop's 14.
var VT1_FONTS = [12, 14, 18, 22, 26, 30, 34];
var vt1FontIdx = (function () {
  var saved = 0;
  try { saved = parseInt(localStorage.getItem('gucos.vt1.fontSize'), 10) || 0; } catch (e) {}
  var px = saved || (mobileViewport() ? 26 : 14);
  var i = VT1_FONTS.indexOf(px);
  return i >= 0 ? i : 1;
})();
window.__osVt1Font = VT1_FONTS[vt1FontIdx];   // agent probe

var term = new Terminal({
  cursorBlink: true,
  // Program stdout arrives raw (the kernel stays out of the output data
  // plane — no OPOST pass), so let xterm treat bare \n as \r\n.
  convertEol: true,
  fontSize: VT1_FONTS[vt1FontIdx],
  fontFamily: "'Menlo', 'Consolas', 'Courier New', monospace",
  theme: { background: '#0d0d1a', foreground: '#c0c0d8', cursor: '#c0c0d8' },
});
var fitAddon = new FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
fitAddon.fit();

var kernel = new Worker('kernel-worker.js');

// ALL tty input funnels through vt1Input so the key strip's sticky Ctrl
// (todos/0212, below) composes with the soft keyboard too.
term.onData(function (data) { vt1Input(data); });
term.onResize(function (sz) { kernel.postMessage({ type: 'resize', cols: sz.cols, rows: sz.rows }); });
window.addEventListener('resize', function () {
  touchUiSync();               // narrow-viewport key strip (todos/0212)
  if (vt === 1) fitAddon.fit();
  else scheduleScreenSync();   // dynamic screen resolution (todos/0023)
});
window.addEventListener('orientationchange', function () {
  // The pane gets its post-rotation size a beat after the event.
  setTimeout(function () {
    touchUiSync();
    if (vt === 1) fitAddon.fit();
    else syncScreenSize();
  }, 120);
});

// VT1 mobile affordances (todos/0212): the tab bar's A−/A+ steps
// term.options.fontSize through VT1_FONTS (live refit; the choice
// persists), and #keystrip offers the keys a soft keyboard lacks. Ctrl is
// a STICKY modifier: it transforms the next single-char input — whether
// from the strip or the keyboard — into its control character. The strip
// only shows on VT1 of a touch/narrow UI (body[data-touchui], kept fresh
// by touchUiSync on resize/orientation). Everything here is VT1/page-side
// only — the desktop path is untouched.
function vt1SetFont(idx) {
  if (idx < 0 || idx >= VT1_FONTS.length || idx === vt1FontIdx) return;
  vt1FontIdx = idx;
  var px = VT1_FONTS[idx];
  term.options.fontSize = px;
  window.__osVt1Font = px;     // agent probe
  try { localStorage.setItem('gucos.vt1.fontSize', String(px)); } catch (e) {}
  if (vt === 1) { fitAddon.fit(); term.focus(); }
}
document.getElementById('fontminus').addEventListener('click', function () { vt1SetFont(vt1FontIdx - 1); });
document.getElementById('fontplus').addEventListener('click', function () { vt1SetFont(vt1FontIdx + 1); });

var vt1CtrlArmed = false;
var vt1CtrlEl = null;
function vt1CtrlSet(on) {
  vt1CtrlArmed = on;
  window.__osVt1Ctrl = on;     // agent probe
  if (vt1CtrlEl) vt1CtrlEl.className = 'stripkey' + (on ? ' armed' : '');
}
function vt1Input(data) {
  if (vt1CtrlArmed && data.length === 1) {
    var c = data.toUpperCase().charCodeAt(0);
    if (c >= 64 && c < 128) data = String.fromCharCode(c & 0x1f);
    vt1CtrlSet(false);
  }
  kernel.postMessage({ type: 'input', data: data });
}
[
  ['Esc', '\x1b'], ['Tab', '\t'], ['Ctrl', null],
  ['←', '\x1b[D'], ['↑', '\x1b[A'], ['↓', '\x1b[B'], ['→', '\x1b[C'],
  ['|', '|'], ['~', '~'], ['/', '/'], ['-', '-'],
].forEach(function (k) {
  var b = document.createElement('span');
  b.className = 'stripkey';
  b.textContent = k[0];
  b.setAttribute('data-key', k[0]);
  if (!k[1]) vt1CtrlEl = b;
  // pointerdown, not click: preventDefault keeps xterm's hidden textarea
  // focused, so the soft keyboard never flickers away.
  b.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (!k[1]) { vt1CtrlSet(!vt1CtrlArmed); return; }
    vt1Input(k[1]);
    term.focus();
  });
  document.getElementById('keystrip').appendChild(b);
});
function touchUiSync() {
  var on = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 ||
           window.innerWidth <= 768;
  if (on) document.body.setAttribute('data-touchui', '1');
  else document.body.removeAttribute('data-touchui');
}
touchUiSync();

// The desktop (todos/WM.md): hand the canvas to the kernel worker (the
// compositor runs THERE — this page stays a dumb bridge) and forward raw
// input. DOM events don't structured-clone, so ship plain objects; the
// kernel side re-shapes them for SDL_WEB's mappers.
var screen = document.getElementById('screen');
var offscreen = screen.transferControlToOffscreen();
kernel.postMessage({ type: 'wm-canvas', canvas: offscreen }, [offscreen]);
function wmSend(ev) { kernel.postMessage({ type: 'wm-input', ev: ev }); }

// VT2 desktop zoom (integer downscale). The clean decoupled approach:
// render FEWER pixels (backing store = floor(pane/Z)) but DISPLAY at the
// full pane (CSS size pinned below) with image-rendering:pixelated, so the
// wm lays everything out on a smaller screen that upscales Z× and stays
// crisp. Integer-only ON PURPOSE: integer scale + nearest-neighbor = zero
// blur, and c/Z is an integer-clean pointer map; a fractional Z would
// reintroduce bilinear blur AND non-integer pointer drift. The render/wm
// path is UNTOUCHED (still 1 logical px = 1 screen px, todos/0023's ruling
// holds) — the ONLY thing zoom taints is the page's pointer seam, confined
// to mapX/mapY (absolute coords) and the /vt2Zoom delta divides below.
// Defaulting (#69 D6): an explicit choice (the ± control or the Desktop-site
// toggle, both through vt2SetZoom) persists in localStorage and always wins;
// with nothing stored, a phone-shaped viewport boots at 2× (the readable
// mobile default over the shipped crisp-zoom mechanism) and everything else
// at 1× — the same saved-else-viewport-default shape as the VT1 font above.
var VT2_ZOOMS = [1, 2, 3];
var vt2Zoom = (function () {
  var z = 0;
  try { z = parseInt(localStorage.getItem('gucos.vt2.zoom'), 10) || 0; } catch (e) {}
  if (!(z >= VT2_ZOOMS[0] && z <= VT2_ZOOMS[VT2_ZOOMS.length - 1])) z = 0;
  return z || (mobileViewport() ? 2 : 1);
})();
window.__osVt2Zoom = vt2Zoom;   // agent probe
// The pointer seam: a CSS-pixel coord maps to logical (backing) px. With the
// CSS display size pinned to the pane and the backing store at floor(pane/Z),
// dividing by Z is that map (correct to within edge rounding; the kernel
// clamps positions to the screen anyway).
function mapX(c) { return Math.round(c / vt2Zoom); }
function mapY(c) { return Math.round(c / vt2Zoom); }
function updateZoomLabel() {
  var el = document.getElementById('zoomlabel');
  if (el) el.textContent = vt2Zoom + '×';
  // The Desktop-site toggle lights while the desktop (1×) view is active.
  var d = document.getElementById('desksite');
  if (d) d.className = 'fontbtn' + (vt2Zoom === 1 ? ' on' : '');
}
function vt2SetZoom(z) {
  z = z | 0;
  if (z < VT2_ZOOMS[0]) z = VT2_ZOOMS[0];
  else if (z > VT2_ZOOMS[VT2_ZOOMS.length - 1]) z = VT2_ZOOMS[VT2_ZOOMS.length - 1];
  if (z === vt2Zoom) return;
  vt2Zoom = z;
  window.__osVt2Zoom = z;   // agent probe
  try { localStorage.setItem('gucos.vt2.zoom', String(z)); } catch (e) {}
  updateZoomLabel();
  // Re-pin the CSS display size and resend the (now different) logical dims.
  // A Z change keeps the pane px but changes floor(pane/Z), so the screenSent
  // dedupe passes and the worker gets a real screen-resize (VT2 only — the
  // pane is measurable only while visible; VT2 entry re-syncs otherwise).
  syncScreenSize();
}
updateZoomLabel();
document.getElementById('zoomminus').addEventListener('click', function () { vt2SetZoom(vt2Zoom - 1); });
document.getElementById('zoomplus').addEventListener('click', function () { vt2SetZoom(vt2Zoom + 1); });
// Desktop-site toggle (#69 D6): zoomed -> the 1× desktop; at 1× -> back to
// the 2× mobile zoom. Routes through vt2SetZoom, so the choice persists and
// overrides the viewport auto-default on the next boot.
document.getElementById('desksite').addEventListener('click', function () {
  vt2SetZoom(vt2Zoom === 1 ? 2 : 1);
});
window.__osVt2SetZoom = vt2SetZoom;   // agent probe (tests drive zoom without a click)

// Dynamic screen resolution (todos/0023): on VT2 the screen tracks the
// #desktop pane (1 CSS px = 1 screen px at Z=1; DPR deliberately ignored).
// A transferred canvas can't be resized from the page, so the LOGICAL pane
// size (floor(pane/Z)) rides {type:'screen-resize'} and the WORKER resizes
// the OffscreenCanvas backing store + re-calls wmSetScreen (-> EV_SCREEN to
// the wm, kernel position clamp). The CSS display size is pinned here to the
// FULL pane so a shrunken backing store upscales (pixelated) to fill it —
// everything Z× bigger and crisp. VT2 entry syncs immediately (the pane is
// measurable only while visible); live window resizes are debounced — every
// send costs a wm taskbar re-lay.
var screenSent = { w: 800, h: 500 };   // last LOGICAL size sent to the worker
window.__osScreen = { w: 800, h: 500 };   // agent probe: last logical size sent
var screenSyncTimer = null;
function syncScreenSize() {
  if (vt !== 2) return;
  var pane = document.getElementById('desktop');
  var pw = pane.clientWidth, ph = pane.clientHeight;
  if (pw <= 0 || ph <= 0) return;                        // hidden/degenerate
  // Pin the canvas DISPLAY size to the full pane (idempotent) — the backing
  // store (worker-owned) shrinks to floor(pane/Z) and upscales into this.
  screen.style.width = pw + 'px';
  screen.style.height = ph + 'px';
  var w = Math.floor(pw / vt2Zoom), h = Math.floor(ph / vt2Zoom);
  if (w <= 0 || h <= 0) return;
  if (w === screenSent.w && h === screenSent.h) return;
  screenSent = { w: w, h: h };
  window.__osScreen = { w: w, h: h };
  kernel.postMessage({ type: 'screen-resize', w: w, h: h });
}
function scheduleScreenSync() {
  if (screenSyncTimer) clearTimeout(screenSyncTimer);
  screenSyncTimer = setTimeout(function () { screenSyncTimer = null; syncScreenSize(); }, 150);
}
function mods(e) {
  var out = {};
  ['Shift', 'Control', 'Alt', 'Meta', 'AltGraph', 'CapsLock', 'NumLock', 'ScrollLock']
    .forEach(function (k) { out[k] = e.getModifierState ? e.getModifierState(k) : false; });
  return out;
}
// Pointer lock (todos/0018): the kernel sends {type:'pointer-lock', wanted}
// when the focused surface wants relative mouse, and RE-SENDS wanted=true
// when a client-area click lands on it (the kernel hit-tests; the page can't)
// — that click is the user gesture the Pointer Lock API needs, so the
// request below succeeds then and no-ops silently otherwise (e.g. at app
// startup with no gesture; the browser-enforced ESC unlock is re-taken by
// the next client click the same way). Transitions are reported back so the
// kernel flips between relative and absolute routing.
var ptrLockWanted = false;
function ptrLocked() { return document.pointerLockElement === screen; }
// Cursor shapes (todos/0105): the kernel derives the effective cursor per
// pointer move (chrome resize cursors overlaid on the hovered surface's own

    // position from the app's last mouse MOTION, and a touch-only session
    // never produced one — without this the wheel would land at (0,0).

screen.addEventListener('keydown', function (e) {

// Host-file drop (todos/0067): drag a file from the host onto the desktop

// Host <-> gucOS clipboard bridge (ticket #79). Two directions over the

//     so a rejection (revoked permission, non-user-driven copy while

//     returns, the HOST clipboard may be the newer intent (see below).
//   host -> gucOS: readText on window FOCUS. To paste into gucOS the user
//     must focus the tab first, and copying in any other app unfocuses it —
//     so the focus sync lands in the kernel slot long before any humanly

//     host clipboard into the tty as input.)

// contested); Ctrl+Alt+F1/F2 and Ctrl+Alt+1/2 remain as aliases. Page-side

// Agent/test probe (OS.md "agent-friendly by construction"): every tty
// output byte also lands in window.__osOut, and __osState tracks the boot,
// so a driver (tests/browser/os-boots.mjs, or any agent) can poll instead
// of scraping the xterm buffer.
window.__osOut = '';

window.__osLogs = [];   // boot-log/kernel lines (agent probe)

      break;
    // On-demand-compositor probe replies (todos/0169) are consumed by the
    // one-shot listeners __osCompositorStats adds; nothing to do here.

    case 'clipboard':
      window.__osClipLast = m.text;   // agent probe
      clipToHost(m.text);
      break;
    case 'boot-log':

      window.__osLogs.push(m.msg);
      if (window.__osLogs.length > 200) window.__osLogs.shift();
      break;
    case 'boot-error':

      break;
    // Two-tab boot guard (todos/0045): the kernel worker takes a Web Lock on

    // nothing mounted. Retry (below) re-attempts — the lock frees when the
    // winning tab closes. No steal in v1.

      window.__osState = 'locked';   // agent probe (tests/browser/os-boots.mjs)

    // before mounting anything. No retry: a reload won't grow a GPU.
    case 'boot-nogpu':

        '(no fallback). Use a browser with WebGPU available in workers,<br>' +
        'e.g. current Chrome or Edge.';

        // kernel just hit-tested; rejects quietly without a gesture.
        try {
          var lockP = screen.requestPointerLock();
          if (lockP && lockP.catch) lockP.catch(function () {});
        } catch (err) { /* no gesture yet */ }
      }
      break;
    // Cursor shape (todos/0105): apply the kernel's effective cursor to the
    // desktop canvas. Ignore while pointer-locked (no cursor exists then).
    case 'cursor':
      if (!ptrLocked()) applyCursor(m.shape | 0);
      break;
    // The audio mixer's output ring (todos/0017): play it with host.js's
    // createAudioReceiver — one synthetic device, resumed on the first user
    // gesture (browser autoplay policy gates AudioContext until then).
    case 'audio': {
      var receiver = createAudioReceiver({ sharedBuffer: m.sab, bufferSize: m.bufferSize });
      receiver.handleMessage({ type: 'audio-open', id: 1, freq: m.freq, format: m.format, channels: m.channels });
      var resumeAudio = function () {
        receiver.handleMessage({ type: 'audio-pause', id: 1, pause: false });
        window.__osAudio = 'playing';   // agent probe
      };
      ['mousedown', 'keydown', 'touchstart'].forEach(function (evName) {
        window.addEventListener(evName, resumeAudio, { once: true, capture: true });
      });
      window.__osAudio = 'ready';       // agent probe: ring received, awaiting gesture
      window.__osAudioSab = m.sab;      // agent probe: tests read queuedBytes
      break;
    }
  }
};
kernel.onerror = function (e) {
  status('kernel worker error: ' + e.message, true);
};

// Two-tab boot guard retry (todos/0045): hide the guard optimistically; if
// the lock is still held the worker answers with another boot-locked and it
// comes right back. The worker ignores retries while a boot is in flight.
document.getElementById('guardRetry').addEventListener('click', function () {
  document.body.removeAttribute('data-guard');
  status('booting…');
  window.__osState = 'booting';
  kernel.postMessage({ type: 'boot-retry' });
});
</script>
</body>
</html>
