<!DOCTYPE html>
<!-- os.html — the reference OS page (todos/0004; design: todos/OS.md
     "Reference build"). A UI bridge: xterm renders bytes, keystrokes go to
     the kernel worker, and every OS-side concern — fs, processes, wm policy,
     compositing — lives in kernel.js / host.js / os-common.js so it stays
     testable under Node (os/boot.js is the same OS with the tty on stdio).
     What this page DOES own is the browser surface the headless twin has no
     equivalent for: the touch gesture state machine, the zoom/CSS pointer
     seam, the host-clipboard bridge, VT + OSK state. That is real logic and
     it is NOT Node-testable — tests/browser/os-*.mjs is its only gate. Keep
     it thin, and keep it covered there.

     VTs (todos/0022, Linux-console semantics): the xterm tty is VT1, the
     desktop VT2 — the page shows exactly one at a time, switched with the
     Terminal/Desktop TAB BAR at the top (the discoverable, primary
     affordance; Ctrl+Alt+F1/F2 and Ctrl+Alt+1/2 remain as aliases). Boot
     STREAMS on VT1 (the log stays visible), then a healthy boot lands on
     VT2 — the desktop is the default tab (todos/0070); boot-error and
     halt force VT1, and a manual switch during boot wins. The point is
     availability under partial failure: VT1's
     path is kernel worker + xterm only — no compositor, no wm — so the
     shell stays usable while the desktop is broken or merely suspect.
     (Boot itself requires WebGPU since todos/0055 — the boot-nogpu guard
     below; a tty-only no-GPU boot was considered and rejected there.)
     Pure page-side state; the kernel keeps compositing while hidden
     (mailbox frames, bounded cost).

     Serve from the repo root — SharedArrayBuffer needs the COOP/COEP
     headers serve.js sends:   node serve.js .   then open /os/os.html  -->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The viewport meta is the OSK v2 Phase 1 root-cause fix (and it is GLOBAL):
     without it mobile Safari lays the page out at ~980px and scales down, so
     innerWidth lies to every mobile-keyed default -- mobileViewport() reads
     false on a real phone. With it, phones report device width: the VT1 font
     default and OSK auto-open activate for the first time on real devices
     (VT2 zoom now DEFAULTS to 1x everywhere; the Desktop-site toggle reaches
     2x as an explicit gesture). viewport-fit=cover exposes env(safe-area-inset-*)
     for the OSK's notch/home-indicator padding. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>gucOS</title>
<link rel="stylesheet" href="../vendor/xterm/xterm.css">
<style>
  /* ============ Touch gestures — ONE contract, kept in ONE place ============
     iOS Safari's native double-tap-to-zoom fights the OS's own zoom controls
     (VT1 A-/A+, VT2 -/2x/+), so it is dropped app-wide. `manipulation` is
     pan-x + pan-y + pinch-zoom: ONLY the double-tap goes. #vtbar's sideways
     pan and page pinch-zoom both keep working — a deliberate contract. Never
     "fix" a zoom bug with user-scalable=no or maximum-scale (iOS ignores the
     first, and both cost accessibility); see the viewport meta above.

     THE RULE THIS FILE KEEPS GETTING WRONG: touch-action DOES NOT INHERIT,
     and on iOS an ANCESTOR's value provably does not cover a descendant
     either. Per spec the effective behavior is the intersection down the
     ancestor chain, so `html, body { manipulation }` alone should already
     suffice — on a real iPhone it does not, three times running (7ae67648,
     1a5a5b33, 4bc04fc4 each had to fix a surface an ancestor already
     "covered"). Reason only from what getComputedStyle reports on the element
     UNDER the touch, never from inheritance or from a container's value.
     tests/browser/os-vt1mobile.mjs asserts exactly that, per surface.

     Hence ONE container-scoped rule over the whole app subtree rather than a
     per-control copy — the per-control shape is precisely what failed every
     time: #uploadbtn shipped with its own guard while its neighbours were
     never retrofitted, and .oskkey carried a guard while the 4px gaps BETWEEN
     the keys did not (a repeat-tap on Enter that drifts ~2px off the key
     lands on .oskin at `auto` and zooms — jku's iPhone repro, verified by
     hit-test in Chromium and WebKit). Membership is now WHERE an element
     lives, not whether someone remembered a property; anything added under
     #wrap later, or generated at runtime (xterm builds its own DOM inside
     #terminal), is covered by construction. The descendant `*` (not `> *`)
     is load-bearing — #fontctl/#zoomctl/.oskin wrap their controls.

     Two surfaces own every touch themselves and narrow to `none`:
       #screen — the desktop canvas; the touch layer below it owns the
                 gesture (todos/0212).
       #osk AND ITS WHOLE SUBTREE — an on-screen keyboard wants no browser
                 gesture at all, in the keys OR the gaps between them. This
                 deliberately narrows the keep-pinch contract INSIDE the
                 keyboard rectangle: a pinch cannot START on the OSK. That is
                 the call, not an oversight — a two-finger gesture on a key
                 grid is an accident, pinch stays live over the terminal and
                 desktop above it, and a subtree whose interior disagrees with
                 its container is the exact bug class this rule exists to end.

     SPECIFICITY IS LOAD-BEARING — but count it correctly: the universal
     selector contributes NOTHING, so `#wrap *` is (1,0,0), NOT (1,0,1).
     Against `.oskkey` (0,1,0) that is an outright win, which is why the OSK
     keys need no local guard. Against a bare `#screen`/`#osk` (1,0,0) it is
     a TIE, broken by SOURCE ORDER — a bare `#screen { touch-action: none }`
     down in its own property block does win today, but only because that
     block sits after this one; it would flip to `manipulation` the day
     someone reorders the stylesheet. So the narrowings live HERE and are
     raised to `#wrap #screen` / `#wrap #osk *` — both (2,0,0), winning on
     specificity alone, unorderable into a bug.
     Keep them here and OUT of the #screen/#osk property blocks below for a
     second, independent reason: raising THOSE selectors instead makes
     `#wrap #osk` (2,0,0) out-specify `body[data-osk] #osk { display: block }`
     (1,1,1) and the OSK would never open. Both halves of this paragraph were
     re-checked against Chromium's computed styles, not inferred. */
  html, body { height: 100%; margin: 0; background: #0d0d1a; touch-action: manipulation; }
  #wrap, #wrap * { touch-action: manipulation; }
  #wrap #screen, #wrap #osk, #wrap #osk * { touch-action: none; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #status {
    font: 12px 'Menlo', 'Consolas', monospace; color: #557755;
    padding: 2px 8px; white-space: nowrap; overflow: hidden;
  }
  #status.error { color: #cc5555; }
  /* When the OSK is open the status strip sits directly under the bottom key
     row (Esc/arrows) — hide it so a thumb on the down-arrow can't graze or
     text-select it while typing. It returns when the keyboard closes. */
  body[data-osk] #status { display: none; }
  /* VT tabs (todos/0022): the primary, discoverable switch — one tab per
     VT, browser-tab styling. Ctrl+Alt+F1/F2 (or 1/2) are quiet aliases. */
  /* One row, sideways scroll on overflow: a phone-width bar holds more
     controls than fit, so children never shrink or wrap and the bar pans.
     The old border-bottom is an inset shadow + 1px bottom padding now: the
     tabs' 1px descent (the active-tab seam trick, top:1px below) must stay
     INSIDE the scroll container's padding box — a real border sits outside
     it and the seam would be clipped once the bar scrolls. Same colors,
     same outer height. Scrollbar hidden (iOS overlays it invisibly anyway);
     touch pan / wheel still scroll. #oskbtn's margin-left:auto right-aligns
     the cluster while the bar fits and collapses to 0 on overflow (no free
     space), so the controls just trail off the right edge and scroll in. */
  #vtbar {
    display: flex; gap: 2px; padding: 6px 8px 1px;
    box-shadow: inset 0 -1px 0 #333355;
    overflow-x: auto; overflow-y: hidden; flex-wrap: nowrap;
    scrollbar-width: none;
  }
  #vtbar::-webkit-scrollbar { display: none; }
  #vtbar > * { flex-shrink: 0; }
  .vttab {
    font: 12px 'Menlo', 'Consolas', monospace; color: #8888a8;
    cursor: pointer; user-select: none; padding: 5px 18px;
    background: #16162a; border: 1px solid #333355; border-bottom: none;
    border-radius: 6px 6px 0 0; position: relative; top: 1px;
  }
  .vttab:hover { color: #c0c0d8; }
  .vttab.active {
    color: #e0e0f0; background: #22223a; border-color: #4a4a77;
  }
  /* OSK toggle (mobile OSK): visible on BOTH VTs and NOT gated on
     data-touchui — it costs nothing on desktop, stays drivable in tests,
     and mouse users can use it too. It heads the tab bar's right cluster,
     so it carries the auto margin (fontctl/zoomctl follow it). */
  #oskbtn { margin-left: auto; }
  #oskbtn.on { background: #4a4a77; color: #ffffff; }
  /* Upload (mobile file ingest): a visible file-picker button for touch
     UIs, where host drag-drop doesn't exist (iOS). Desktop keeps the
     drag-onto-the-pane path and hides this. (Its double-tap-zoom guard
     comes from the `#wrap *` subtree rule at the top of this stylesheet —
     there is no #vtbar-scoped rule; it no longer carries a local copy.) */
  #uploadbtn { display: none; }
  body[data-touchui] #uploadbtn { display: inline-block; }
  /* VT1 font-size steps (todos/0212): right-aligned in the tab bar, only
     meaningful while the tty is visible. */
  #fontctl { display: flex; gap: 2px; }
  body[data-vt="2"] #fontctl { display: none; }
  .fontbtn {
    font: 12px 'Menlo', 'Consolas', monospace; color: #8888a8;
    cursor: pointer; user-select: none; -webkit-user-select: none;
    padding: 5px 12px; background: #16162a; border: 1px solid #333355;
    border-bottom: none; border-radius: 6px 6px 0 0;
    position: relative; top: 1px;
  }
  .fontbtn:hover { color: #c0c0d8; }
  /* VT2 desktop zoom (integer UPSCALE at Z>=1, fractional high-density
     DOWNSCALE at Z<1 — VT2_ZOOMS in the script below): the ± strip is only
     meaningful while the desktop is visible, so it is VT2- and touch-gated.
     That gate is on the CONTROL only — the zoom FACTOR is settable on any
     device by the Control Panel Display applet (applyDisplayConfig) or by a
     localStorage choice persisted while the viewport was narrow, so a
     non-touch desktop is NOT guaranteed Z=1. */
  #zoomctl { display: none; gap: 2px; }
  body[data-vt="2"][data-touchui] #zoomctl { display: flex; }
  /* "Desktop site" toggle (#69 D6): the standard mobile-browser affordance —
     flips between the unzoomed 1× desktop (the boot default everywhere) and
     the 2× mobile zoom, as an explicit persisted gesture. Same visibility
     gate as the zoom control it drives. */
  #desksite { display: none; }
  body[data-vt="2"][data-touchui] #desksite { display: inline-block; }
  #desksite.on { background: #4a4a77; color: #ffffff; }
  /* Full Screen toggle (#398): browser element fullscreen for the whole page.
     Hidden unless JS proves the API exists (data-fs-ok) — iOS Safari has
     video-only fullscreen and must not get a dead button. #vtbar stays
     VISIBLE in fullscreen on purpose: it is the only mouse route back out
     (hold-Esc alone is the trap the Chrome escape hatch exists to rescue).
     The .on class is owned by the fullscreenchange EVENT, never the click. */
  #fsbtn { display: none; }
  body[data-fs-ok] #fsbtn { display: inline-block; }
  #fsbtn.on { background: #4a4a77; color: #ffffff; }
  .fontlabel {
    font: 12px 'Menlo', 'Consolas', monospace; color: #8888a8;
    padding: 5px 6px; user-select: none; -webkit-user-select: none;
    align-self: center; min-width: 20px; text-align: center;
  }
  /* Mobile key strip (todos/0212): tty keys a soft keyboard lacks. Shown
     only on VT1 and only on a touch/narrow UI (data-touchui, set by JS). */
  #keystrip { display: none; gap: 4px; padding: 4px 8px 6px; flex-wrap: wrap; }
  body[data-vt="1"][data-touchui] #keystrip { display: flex; }
  .stripkey {
    font: 13px 'Menlo', 'Consolas', monospace; color: #c0c0d8;
    background: #16162a; border: 1px solid #333355; border-radius: 5px;
    padding: 7px 0; width: 44px; text-align: center; cursor: pointer;
    user-select: none; -webkit-user-select: none;
    /* (double-tap-zoom guard: the `#wrap *` subtree rule at the top — there
       is no #keystrip-scoped rule) */
  }
  .stripkey:hover { color: #e0e0f0; border-color: #4a4a77; }
  .stripkey.armed { background: #4a4a77; color: #ffffff; }
  /* On-screen keyboard (mobile OSK, os/osk.js): a flex SIBLING of the VT
     panes at its NATURAL layout height — opening it shrinks the flex:1 pane
     above it, which on VT2 flows through syncScreenSize -> screen-resize ->
     the wm re-lays the taskbar and re-clamps windows (occlusion solved by
     the 0023 dynamic screen; composes with zoom's floor(pane/Z) for free).
     The OSK owns its touches — keys AND the gaps between them — via the
     `#wrap #osk, #wrap #osk *` narrowing in the touch-gesture block at the
     top of this stylesheet. Deliberately NOT declared here: a bare `#osk`
     (1,0,0) only TIES `#wrap *` (1,0,0) and would depend on source order,
     and raising this selector instead would out-specify the display rules
     below (both re-derived in the specificity note up there). */
  #osk { display: none;
         user-select: none; -webkit-user-select: none;
         /* Safe-area insets (viewport-fit=cover): the bottom row clears the
            home indicator, the side keys clear a landscape notch; on
            inset-less displays the max() floors keep a slim gutter — 2px at
            the sides, 6px at the bottom. */
         padding-top: 2px;
         padding-left:   max(2px, env(safe-area-inset-left));
         padding-right:  max(2px, env(safe-area-inset-right));
         padding-bottom: max(6px, env(safe-area-inset-bottom)); }
  body[data-osk] #osk { display: block; }
  body[data-guard] #osk { display: none; }
  /* The OSK supersedes the 0212 keystrip while open — a real superset
     since the clipboard-seam landing: Ctrl+Shift+C/V run the keystrip's
     gesture-scoped copy/paste and the Fn layer carries Copy/Paste legends
     (os/osk.js ttyClip). Before that the OSK had NO clipboard keys and
     hiding the strip took away a phone's only paste affordance.
     The full attribute chain out-specifies the keystrip's show rule. */
  body[data-osk][data-vt="1"][data-touchui] #keystrip { display: none; }
  .oskin { max-width: 760px; margin: 0 auto; --oskfs: clamp(17px, 5vw, 20px); }
  .oskrow { display: flex; gap: 4px; margin-top: 4px; }
  .oskkey {
    flex: 1 1 0; min-width: 0; overflow: hidden; white-space: nowrap;
    /* No touch-action here: guarding the KEY while leaving the 4px gaps
       around it at `auto` is what let a drifting repeat-tap on Enter zoom
       the page. The whole #osk subtree is `none` from the top block. */
    /* Bigger, touch-friendly keys: font + vertical padding scale up with the
       viewport (clamp). Key height = line box + 2*pad + 2px border, and the
       line box is calc'd from --oskfs (not the key's own font-size) so the
       long-legend tier below keeps the same row rhythm: at 390px that's
       19.5*1.25 + 2*14.8 + 2 = ~56px-tall targets; small phones bottom out
       near ~49px and the clamp caps hold desktop at ~59px. Horizontal
       padding stays 0 so the flex row (flex 1 1 0) shares width evenly and
       never overflows. */
    font-family: 'Menlo', 'Consolas', monospace;
    font-size: var(--oskfs); line-height: calc(var(--oskfs) * 1.25);
    color: #c0c0d8;
    background: #16162a; border: 1px solid #333355; border-radius: 5px;
    padding: clamp(13px, 3.8vw, 16px) 0; text-align: center; cursor: pointer;
    user-select: none; -webkit-user-select: none;
  }
  /* Multi-char legends (Ctrl, PgUp, ?123, ...) get a smaller font so they
     still fit their flex share at phone widths; the inherited calc()
     line-height (from --oskfs, above) keeps every key in the row the same
     height and the text vertically centered. */
  .oskkey.long { font-size: clamp(13px, 3.4vw, 16px); }
  .oskkey:hover { color: #e0e0f0; border-color: #4a4a77; }
  .oskkey.armed { background: #4a4a77; color: #ffffff; }
  .oskkey.locked { background: #6a6ab7; color: #ffffff; border-color: #9a9ad7; }
  /* Mode-inapplicable keys (the tty-only Copy/Paste legends while the OSK
     serves VT2): visible but dimmed and inert — layout stays stable across
     a VT switch. */
  .oskkey.dim { color: #55556a; cursor: default; }
  .oskkey.dim:hover { color: #55556a; border-color: #333355; }
  /* Touch devices get bigger keys now that the viewport meta makes the
     width real: at 390px this is ~20px glyphs on ~62px-tall targets, edge
     to edge. Gated on pointer:coarse so mouse desktops are provably
     untouched (they keep the clamps above). The .oskin 760px cap stays
     as-is everywhere -- it is inert on phones (390 < 760) and is the
     centering guard on tablets/touch desktops; don't remove it. */
  @media (pointer: coarse) {
    .oskin  { --oskfs: clamp(17px, 5.2vw, 22px); }
    .oskkey { padding: clamp(14px, 4.4vw, 18px) 0; }
  }
  /* The desktop (todos/WM.md): the kernel composites windows onto this
     canvas in its worker; the page only forwards raw input. At zoom Z=1 the
     canvas is natural-size (backing store == pane == CSS size), so event
     offsets equal screen coordinates. At Z>1 (VT2 desktop zoom) the backing
     store shrinks to floor(pane/Z) while the CSS display size is pinned to
     the full pane, so the render stays 1 logical px = 1 screen px and only
     the page's pointer seam divides CSS coords by Z (see syncScreenSize /
     mapX). At Z<1 (high-density mode) the backing store GROWS past the pane
     and downscales into it — more logical px, everything smaller. The
     image-rendering below is the Z>=1 default: pixelated makes the integer
     upscale crisp NxN blocks (nearest-neighbor, zero blur — why upscale
     steps are integer-only); Z<1 flips it to auto in JS (vt2ApplyRenderMode)
     because a nearest-neighbor DOWNSCALE drops pixels — smooth filtering of
     the oversampled render is what looks right there. overflow hidden covers
     the resize transient while the worker's canvas commit lags the layout. */
  #desktop { flex: 1; min-height: 0; display: flex; justify-content: center;
             align-items: center; background: #06131a; overflow: hidden; }
  /* Host-file drop target highlight (todos/0067): while a drag hovers the
     desktop pane, an inset ring says "this lands in ~/Desktop". */
  #desktop.droptarget { box-shadow: inset 0 0 0 3px #5599dd; }
  /* The touch layer below owns every touch gesture on the desktop canvas —
     no browser scroll/double-tap-zoom (todos/0212). Declared as
     `#wrap #screen` in the touch-gesture block at the top, not here: a bare
     `#screen` (1,0,0) only TIES `#wrap *` (1,0,0), so it would win by this
     block's position alone. See the specificity note there. */
  #screen { outline: none; display: block;
            image-rendering: pixelated; }
  #terminal { flex: 1; min-height: 0; padding: 4px; }
  /* VTs: exactly one of tty/desktop is visible (todos/0022). */
  body[data-vt="1"] #desktop { display: none; }
  body[data-vt="2"] #terminal { display: none; }
  /* Boot guard screen — two-tab lock (todos/0045: retry re-attempts) and
     the WebGPU requirement (todos/0055: no retry — the compositor IS
     WebGPU, no fallback) — shown INSTEAD of the VT panes. */
  #guard { flex: 1; display: none; flex-direction: column; gap: 14px;
           align-items: center; justify-content: center; text-align: center;
           font: 14px 'Menlo', 'Consolas', monospace; color: #c0c0d8; }
  #guard button {
    font: 13px 'Menlo', 'Consolas', monospace; color: #e0e0f0;
    background: #22223a; border: 1px solid #4a4a77; border-radius: 6px;
    padding: 6px 22px; cursor: pointer;
  }
  #guard button:hover { background: #2c2c4a; border-color: #6a6aa7; }
  body[data-guard] #guard { display: flex; }
  body[data-guard] #vtbar, body[data-guard] #terminal,
  body[data-guard] #desktop { display: none; }
</style>
</head>
<body data-vt="1">
<div id="wrap">
  <div id="vtbar">
    <span id="vt1tab" class="vttab active" title="the tty, VT1 (Ctrl+Alt+F1)">Terminal</span>
    <span id="vt2tab" class="vttab" title="the desktop, VT2 (Ctrl+Alt+F2). Ctrl+Alt+Tab cycles windows, +Shift for previous (todos/0032); Ctrl+Esc opens the Start menu (todos/0078); Ctrl+Alt+E shows all windows (Exposé — the Task-View button right of Start does the same)">Desktop</span>
    <span id="oskbtn" class="fontbtn" title="on-screen keyboard">&#9000;</span>
    <span id="fontctl" title="terminal font size">
      <span id="fontminus" class="fontbtn">A&minus;</span><span id="fontplus" class="fontbtn">A+</span>
    </span>
    <span id="zoomctl" title="desktop zoom (below 1&times; = denser: more fits)">
      <span id="zoomminus" class="fontbtn">&minus;</span><span id="zoomlabel" class="fontlabel">1&times;</span><span id="zoomplus" class="fontbtn">+</span>
    </span>
    <span id="desksite" class="fontbtn" title="desktop site: the unzoomed 1&times; desktop (tap again for the 2&times; mobile zoom)">Desktop site</span>
    <span id="uploadbtn" class="fontbtn" title="upload a file to the OS desktop (lands in /root/Desktop)">Upload</span>
    <span id="fsbtn" class="fontbtn" title="full screen">&#9974;</span>
    <input id="uploadinput" type="file" multiple style="display:none">
  </div>
  <div id="desktop"><canvas id="screen" width="800" height="500" tabindex="0"></canvas></div>
  <div id="terminal"></div>
  <div id="keystrip"></div>
  <div id="osk"></div>
  <div id="guard">
    <div id="guardMsg">gucOS is already running in another tab.<br>
         Close that tab, then retry — the lock frees when it closes.</div>
    <button id="guardRetry">Retry</button>
  </div>
  <div id="status">booting…</div>
</div>
<script src="../vendor/xterm/xterm.js"></script>
<script src="../vendor/xterm/xterm-addon-fit.js"></script>
<!-- host.js on the page ONLY for createAudioReceiver (todos/0017): the
     mixer's output ring plays through the same Web Audio path standalone
     pages use. The page stays a dumb bridge — no other host.js use here. -->
<script src="../host.js"></script>
<!-- The on-screen keyboard component (mobile OSK) — page-side only. -->
<script src="osk.js"></script>
<script>
'use strict';

var statusEl = document.getElementById('status');
function status(msg, isError) {
  statusEl.textContent = msg;
  statusEl.className = isError ? 'error' : '';
}

if (typeof SharedArrayBuffer === 'undefined') {
  status('SharedArrayBuffer unavailable — serve this page with COOP/COEP headers (node serve.js .)', true);
  throw new Error('no SAB');
}

// The phone-shaped-viewport predicate: the auto-default signal behind the
// VT1 font bump (todos/0212) and the OSK's open-by-default — those two call
// sites and no others. It no longer drives any VT2 zoom default: #69 D6 was
// revised to boot EVERY viewport at 1× (see vt2Zoom below).
// It is a DIFFERENT predicate from touchUiSync's touch-or-narrow test, not a
// subset of it. Intended: a touch-capable WIDE viewport (a tablet, a
// touchscreen laptop) gets the mobile CONTROLS but keeps desktop-density
// defaults. Also true, and less intended: a short-but-wide non-touch window
// (900×600 — min() ≤ 700, innerWidth > 768) trips THIS predicate while
// data-touchui stays off. Explicit choices override either way.
function mobileViewport() {
  return Math.min(window.innerWidth, window.innerHeight) <= 700;
}

// VT1 font-size steps (todos/0212): an explicit choice persists in
// localStorage; with nothing stored, a narrow (phone-shaped) viewport
// defaults to 26px against the desktop's 14 — THREE steps up VT1_FONTS, not
// one (0212 shipped a one-step 18px mobile default; #69 D6 raised it).
var VT1_FONTS = [12, 14, 18, 22, 26, 30, 34];
var vt1FontIdx = (function () {
  var saved = 0;
  try { saved = parseInt(localStorage.getItem('gucos.vt1.fontSize'), 10) || 0; } catch (e) {}
  var px = saved || (mobileViewport() ? 26 : 14);
  var i = VT1_FONTS.indexOf(px);
  return i >= 0 ? i : 1;
})();
window.__osVt1Font = VT1_FONTS[vt1FontIdx];   // agent probe

var term = new Terminal({
  cursorBlink: true,
  // Program stdout arrives raw (the kernel stays out of the output data
  // plane — no OPOST pass), so let xterm treat bare \n as \r\n.
  convertEol: true,
  fontSize: VT1_FONTS[vt1FontIdx],
  fontFamily: "'Menlo', 'Consolas', 'Courier New', monospace",
  theme: { background: '#0d0d1a', foreground: '#c0c0d8', cursor: '#c0c0d8' },
});

// Warm-pool probe (ticket #351): fresh {free, depth, created, warmTakes,
// coldCreates, evicted, tornDown, served} from the kernel worker. Answered
// even on a locked/never-booted tab (the two-tab guard leg needs that).
window.__osPoolStats = function () {
  return new Promise(function (resolve) {
    function h(e) {
      if (e.data && e.data.type === 'pool-stats') {
        kernel.removeEventListener('message', h);
        resolve(e.data.stats);
      }
    }
    kernel.addEventListener('message', h);
    kernel.postMessage({ type: 'pool-stats' });
  });
};
var outDecoder = new TextDecoder();

kernel.onmessage = function (e) {
  var m = e.data;
  switch (m.type) {
    case 'out':
      term.write(m.bytes);
      window.__osOut += outDecoder.decode(m.bytes, { stream: true });
      break;
    // On-demand-compositor probe replies (todos/0169) are consumed by the
    // one-shot listeners __osCompositorStats adds; nothing to do here.
    case 'compositor-stats':
      break;
    // Warm-pool probe replies (ticket #351) — same one-shot-listener pattern.
    case 'pool-stats':
      break;
    // gucOS -> host clipboard (ticket #79): a process committed a text copy.
    case 'clipboard':
      window.__osClipLast = m.text;   // agent probe
      clipToHost(m.text);
      break;
    // The clipboard seam: a paste consumer is PARKED in the kernel on
    // CLIP_GET awaiting this refresh. The triggering keystroke/tap/click is
    // milliseconds old, so its transient user activation legalizes readText
    // here — on iOS this is where the paste callout raises, AT paste time
    // (the platform's own paste-security UI, surfaced instead of failed
    // around). A gesture-less consumer (a scripted `clip -o`) gets an
    // immediate done and is served the cached slot — pre-seam semantics, no
    // prompt spam. The done must ALWAYS post: the kernel worker's timeout
    // is the backstop, not the plan.
    case 'clip-read': {
      window.__osClipRead = (window.__osClipRead || 0) + 1;   // agent probe
      var clipDone = function () { kernel.postMessage({ type: 'clip-read-done' }); };
      var uact = navigator.userActivation;
      if (uact && !uact.isActive) clipDone();
      else clipFromHost(clipDone);
      break;
    }
    // Egress (todos/0398): the kernel materialized ONE artifact (a file's
    // bytes, or one zip for a directory/multi-selection) for a Download /
    // Save-As the user clicked moments ago — that click's transient
    // activation is still live (the clip-read principle, no parking needed:
    // the data dependency points kernel-ward). One artifact per gesture, so
    // the "multiple automatic downloads" prompt is structurally avoided.
    case 'egress': {
      var egBlob = new Blob([new Uint8Array(m.bytes)],
                            { type: 'application/octet-stream' });
      window.__osEgress = (window.__osEgress || 0) + 1;        // agent probe
      window.__osEgressLast = { dispo: m.dispo, name: m.name,
                                size: egBlob.size };
      if (m.dispo === 'saveas' && window.showSaveFilePicker) {
        window.showSaveFilePicker({ suggestedName: m.name }).then(function (h) {
          return h.createWritable().then(function (w) {
            return w.write(egBlob).then(function () { return w.close(); });
          });
        }).catch(function (err) {
          // AbortError = the user cancelled the picker — their call.
          if (!err || err.name !== 'AbortError')
            console.warn('egress saveas failed: ' + err);
        });
        break;
      }
      if (m.dispo === 'saveas')
        console.warn('egress: showSaveFilePicker unavailable — anchor download instead');
      var egUrl = URL.createObjectURL(egBlob);
      var egA = document.createElement('a');
      egA.href = egUrl;
      egA.download = m.name;
      egA.click();
      setTimeout(function () { URL.revokeObjectURL(egUrl); }, 0);
      break;
    }
    case 'boot-log':
      status(m.msg);
      window.__osLogs.push(m.msg);
      if (window.__osLogs.length > 200) window.__osLogs.shift();
      break;
    // Spawn trace (ticket #350, ?spawntrace=1 only): per-spawn phase stamps
    // from kernel-worker/process-worker — agent probe, never rendered.
    // Fragments merge by pid (instantiate / first-output / exit events).
    case 'spawn-trace': {
      var sta = (window.__spawnTraces = window.__spawnTraces || []);
      var st = m.trace, sti = sta.length - 1;
      for (; sti >= 0; sti--) if (sta[sti].pid === st.pid) { Object.assign(sta[sti], st); break; }
      if (sti < 0) sta.push(st);
      break;
    }
    case 'boot-error':
      status('boot failed', true);
      window.__osState = 'error';
      window.__osBootErr = m.msg;   // agent probe: the full failure text
      setVt(1);   // the escape hatch surfaces the failure (todos/0022)
      term.write('\r\n\x1b[31mboot failed:\x1b[0m\r\n' + m.msg.replace(/\n/g, '\r\n') + '\r\n');
      break;
    // Two-tab boot guard (todos/0045): the kernel worker takes a Web Lock on
    // the image pair BEFORE mounting OPFS; a losing tab lands here with
    // nothing mounted. Retry (below) re-attempts — the lock frees when the
    // winning tab closes. No steal in v1.
    case 'boot-locked':
      status('already running in another tab', true);
      window.__osState = 'locked';   // agent probe (tests/browser/os-boots.mjs)
      document.getElementById('guardRetry').style.display = '';
      document.body.setAttribute('data-guard', '1');
      break;
    // WebGPU boot guard (todos/0055): the kernel worker found no adapter/
    // device — the compositor is WebGPU with NO fallback (decision log
    // logs/2026-07-09/webgpu-mvu-direction.md), so the boot stops loudly
    // before mounting anything. No retry: a reload won't grow a GPU.
    case 'boot-nogpu':
      status('WebGPU unavailable — cannot boot', true);
      window.__osState = 'nogpu';    // agent probe (tests/browser/os-boots.mjs)
      document.getElementById('guardMsg').innerHTML =
        'gucOS requires WebGPU in Web Workers — the desktop compositor<br>' +
        'renders with it (no fallback). This browser did not provide a<br>' +
        'worker WebGPU adapter: unsupported here, or disabled in settings.';
      document.getElementById('guardRetry').style.display = 'none';
      document.body.setAttribute('data-guard', '1');
      break;
    case 'ready':
      status('running (image: ' + m.mode + ') — files persist in OPFS');
      window.__osState = 'ready';
      kernel.postMessage({ type: 'resize', cols: term.cols, rows: term.rows });
      // Desktop as the default tab (todos/0070): the boot log streamed on
      // VT1; a HEALTHY boot now lands on the desktop. boot-error/halt never
      // race this ('ready' fires exactly once, on success), and a manual
      // switch during boot wins — the tty stays one click away either way.
      if (!vtTouched) setVt(2);
      else if (vt === 1) term.focus();
      break;
    case 'halt': {
      var sig = m.status & 0x7f;
      var code = sig ? 128 + sig : (m.status >> 8) & 0xff;
      status('halted (exit ' + code + ') — reload to reboot', true);
      window.__osState = 'halted:' + code;
      setVt(1);   // the halt notice lives on the tty (todos/0022)
      term.write('\r\n\x1b[33m[system halted — reload the page to reboot]\x1b[0m\r\n');
      break;
    }
    // Relative mouse (todos/0018): the kernel's wanted state / lock re-offer
    // (see the pointer-lock comment above the mousedown handler).
    case 'pointer-lock':
      ptrLockWanted = !!m.wanted;
      window.__osPtrLockWanted = ptrLockWanted;   // agent probe
      if (ptrLockWanted) window.__osPtrLockOffers = (window.__osPtrLockOffers || 0) + 1;   // agent probe
      if (!ptrLockWanted && ptrLocked() && document.exitPointerLock) {
        document.exitPointerLock();
      } else if (ptrLockWanted && vt === 2 && !ptrLocked() && screen.requestPointerLock) {
        // Succeeds inside the transient activation of the client click the
        // kernel just hit-tested; rejects quietly without a gesture.
        try {
          var lockP = screen.requestPointerLock();
          if (lockP && lockP.catch) lockP.catch(function () {});
        } catch (err) { /* no gesture yet */ }
      }
      break;
    // Cursor shape (todos/0105): apply the kernel's effective cursor to the
    // desktop canvas. Ignore while pointer-locked (no cursor exists then).
    case 'cursor':
      if (!ptrLocked()) applyCursor(m.shape | 0);
      break;
    // The display-density bridge (hires-display): the worker resolved the
    // display cfgstore overlay — at boot (pre-'ready', so this lands before
    // the VT2 auto-switch) and on every settled store write (the Control
    // Panel Display applet's live Apply).
    case 'display-config':
      applyDisplayConfig(m.zoom);
      break;
    // The audio mixer's output ring (todos/0017): play it with host.js's
    // createAudioReceiver — one synthetic device, resumed on the first user
    // gesture (browser autoplay policy gates AudioContext until then).
    case 'audio': {
      var receiver = createAudioReceiver({ sharedBuffer: m.sab, bufferSize: m.bufferSize });
      receiver.handleMessage({ type: 'audio-open', id: 1, freq: m.freq, format: m.format, channels: m.channels });
      var resumeAudio = function () {
        receiver.handleMessage({ type: 'audio-pause', id: 1, pause: false });
        window.__osAudio = 'playing';   // agent probe
      };
      ['mousedown', 'keydown', 'touchstart'].forEach(function (evName) {
        window.addEventListener(evName, resumeAudio, { once: true, capture: true });
      });
      window.__osAudio = 'ready';       // agent probe: ring received, awaiting gesture
      window.__osAudioSab = m.sab;      // agent probe: tests read queuedBytes
      break;
    }
  }
};
kernel.onerror = function (e) {
  status('kernel worker error: ' + e.message, true);
};

// Two-tab boot guard retry (todos/0045): hide the guard optimistically; if
// the lock is still held the worker answers with another boot-locked and it
// comes right back. The worker ignores retries while a boot is in flight.
document.getElementById('guardRetry').addEventListener('click', function () {
  document.body.removeAttribute('data-guard');
  status('booting…');
  window.__osState = 'booting';
  kernel.postMessage({ type: 'boot-retry' });
});
</script>
</body>
</html>
