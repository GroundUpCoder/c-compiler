<!DOCTYPE html>
<!-- os.html — the reference OS page (todos/0004; design: todos/OS.md
     "Reference build"). Deliberately a dumb UI bridge: xterm renders bytes,
     keystrokes go to the kernel worker, and EVERYTHING with logic lives in
     kernel.js / host.js / os-common.js so it stays testable under Node
     (os/boot.js is the same OS with the tty on stdio).

     Serve from the repo root — SharedArrayBuffer needs the COOP/COEP
     headers serve.js sends:   node serve.js .   then open /os/os.html  -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>wasm-os</title>
<link rel="stylesheet" href="../vendor/xterm/xterm.css">
<style>
  html, body { height: 100%; margin: 0; background: #0d0d1a; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #status {
    font: 12px 'Menlo', 'Consolas', monospace; color: #557755;
    padding: 2px 8px; white-space: nowrap; overflow: hidden;
  }
  #status.error { color: #cc5555; }
  /* The desktop (todos/WM.md): the kernel composites windows onto this
     canvas in its worker; the page only forwards raw input. Natural-size
     canvas (no CSS scaling) keeps event offsets == screen coordinates. */
  #desktop { display: flex; justify-content: center; background: #06131a; }
  #screen { outline: none; display: block; }
  #terminal { flex: 1; min-height: 0; padding: 4px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="desktop"><canvas id="screen" width="800" height="500" tabindex="0"></canvas></div>
  <div id="terminal"></div>
  <div id="status">booting…</div>
</div>
<script src="../vendor/xterm/xterm.js"></script>
<script src="../vendor/xterm/xterm-addon-fit.js"></script>
<!-- host.js on the page ONLY for createAudioReceiver (todos/0017): the
     mixer's output ring plays through the same Web Audio path standalone
     pages use. The page stays a dumb bridge — no other host.js use here. -->
<script src="../host.js"></script>
<script>
'use strict';

var statusEl = document.getElementById('status');
function status(msg, isError) {
  statusEl.textContent = msg;
  statusEl.className = isError ? 'error' : '';
}

if (typeof SharedArrayBuffer === 'undefined') {
  status('SharedArrayBuffer unavailable — serve this page with COOP/COEP headers (node serve.js .)', true);
  throw new Error('no SAB');
}

var term = new Terminal({
  cursorBlink: true,
  // Program stdout arrives raw (the kernel stays out of the output data
  // plane — no OPOST pass), so let xterm treat bare \n as \r\n.
  convertEol: true,
  fontSize: 14,
  fontFamily: "'Menlo', 'Consolas', 'Courier New', monospace",
  theme: { background: '#0d0d1a', foreground: '#c0c0d8', cursor: '#c0c0d8' },
});
var fitAddon = new FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
fitAddon.fit();

var kernel = new Worker('kernel-worker.js');

term.onData(function (data) { kernel.postMessage({ type: 'input', data: data }); });
term.onResize(function (sz) { kernel.postMessage({ type: 'resize', cols: sz.cols, rows: sz.rows }); });
window.addEventListener('resize', function () { fitAddon.fit(); });

// The desktop (todos/WM.md): hand the canvas to the kernel worker (the
// compositor runs THERE — this page stays a dumb bridge) and forward raw
// input. DOM events don't structured-clone, so ship plain objects; the
// kernel side re-shapes them for SDL_WEB's mappers.
var screen = document.getElementById('screen');
var offscreen = screen.transferControlToOffscreen();
kernel.postMessage({ type: 'wm-canvas', canvas: offscreen }, [offscreen]);
function wmSend(ev) { kernel.postMessage({ type: 'wm-input', ev: ev }); }
function mods(e) {
  var out = {};
  ['Shift', 'Control', 'Alt', 'Meta', 'AltGraph', 'CapsLock', 'NumLock', 'ScrollLock']
    .forEach(function (k) { out[k] = e.getModifierState ? e.getModifierState(k) : false; });
  return out;
}
screen.addEventListener('mousedown', function (e) {
  screen.focus();
  wmSend({ kind: 'down', x: e.offsetX, y: e.offsetY, button: e.button });
  e.preventDefault();
});
screen.addEventListener('mouseup', function (e) {
  wmSend({ kind: 'up', x: e.offsetX, y: e.offsetY, button: e.button });
});
screen.addEventListener('mousemove', function (e) {
  wmSend({ kind: 'move', x: e.offsetX, y: e.offsetY, buttons: e.buttons });
});
screen.addEventListener('wheel', function (e) {
  wmSend({ kind: 'wheel', x: e.offsetX, y: e.offsetY, deltaX: e.deltaX, deltaY: e.deltaY, deltaMode: e.deltaMode });
  e.preventDefault();
}, { passive: false });
screen.addEventListener('contextmenu', function (e) { e.preventDefault(); });
screen.addEventListener('keydown', function (e) {
  wmSend({ kind: 'key', down: true, code: e.code, key: e.key, repeat: e.repeat, mods: mods(e) });
  e.preventDefault();
});
screen.addEventListener('keyup', function (e) {
  wmSend({ kind: 'key', down: false, code: e.code, key: e.key, repeat: e.repeat, mods: mods(e) });
  e.preventDefault();
});

// Agent/test probe (OS.md "agent-friendly by construction"): every tty
// output byte also lands in window.__osOut, and __osState tracks the boot,
// so a driver (tests/browser/os-boots.mjs, or any agent) can poll instead
// of scraping the xterm buffer.
window.__osOut = '';
window.__osState = 'booting';
window.__osLogs = [];   // boot-log/kernel lines (agent probe)
var outDecoder = new TextDecoder();

kernel.onmessage = function (e) {
  var m = e.data;
  switch (m.type) {
    case 'out':
      term.write(m.bytes);
      window.__osOut += outDecoder.decode(m.bytes, { stream: true });
      break;
    case 'boot-log':
      status(m.msg);
      window.__osLogs.push(m.msg);
      if (window.__osLogs.length > 200) window.__osLogs.shift();
      break;
    case 'boot-error':
      status('boot failed', true);
      window.__osState = 'error';
      window.__osBootErr = m.msg;   // agent probe: the full failure text
      term.write('\r\n\x1b[31mboot failed:\x1b[0m\r\n' + m.msg.replace(/\n/g, '\r\n') + '\r\n');
      break;
    case 'ready':
      status('running (image: ' + m.mode + ') — files persist in OPFS');
      window.__osState = 'ready';
      kernel.postMessage({ type: 'resize', cols: term.cols, rows: term.rows });
      term.focus();
      break;
    case 'halt': {
      var sig = m.status & 0x7f;
      var code = sig ? 128 + sig : (m.status >> 8) & 0xff;
      status('halted (exit ' + code + ') — reload to reboot', true);
      window.__osState = 'halted:' + code;
      term.write('\r\n\x1b[33m[system halted — reload the page to reboot]\x1b[0m\r\n');
      break;
    }
    // The audio mixer's output ring (todos/0017): play it with host.js's
    // createAudioReceiver — one synthetic device, resumed on the first user
    // gesture (browser autoplay policy gates AudioContext until then).
    case 'audio': {
      var receiver = createAudioReceiver({ sharedBuffer: m.sab, bufferSize: m.bufferSize });
      receiver.handleMessage({ type: 'audio-open', id: 1, freq: m.freq, format: m.format, channels: m.channels });
      var resumeAudio = function () {
        receiver.handleMessage({ type: 'audio-pause', id: 1, pause: false });
        window.__osAudio = 'playing';   // agent probe
      };
      ['mousedown', 'keydown', 'touchstart'].forEach(function (evName) {
        window.addEventListener(evName, resumeAudio, { once: true, capture: true });
      });
      window.__osAudio = 'ready';       // agent probe: ring received, awaiting gesture
      window.__osAudioSab = m.sab;      // agent probe: tests read queuedBytes
      break;
    }
  }
};
kernel.onerror = function (e) {
  status('kernel worker error: ' + e.message, true);
};
</script>
</body>
</html>
