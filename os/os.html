<!DOCTYPE html>
<!-- os.html — the reference OS page (todos/0004; design: todos/OS.md
     "Reference build"). Deliberately a dumb UI bridge: xterm renders bytes,
     keystrokes go to the kernel worker, and EVERYTHING with logic lives in
     kernel.js / host.js / os-common.js so it stays testable under Node
     (os/boot.js is the same OS with the tty on stdio).

     VTs (todos/0022, Linux-console semantics): the xterm tty is VT1, the
     desktop VT2 — the page shows exactly one at a time, switched with the
     Terminal/Desktop TAB BAR at the top (the discoverable, primary
     affordance; Ctrl+Alt+F1/F2 and Ctrl+Alt+1/2 remain as aliases). Boot
     STREAMS on VT1 (the log stays visible), then a healthy boot lands on
     VT2 — the desktop is the default tab (todos/0070); boot-error and
     halt force VT1, and a manual switch during boot wins. The point is
     availability under partial failure: VT1's
     path is kernel worker + xterm only — no compositor, no wm — so the
     shell stays usable while the desktop is broken or merely suspect.
     (Boot itself requires WebGPU since todos/0055 — the boot-nogpu guard
     below; a tty-only no-GPU boot was considered and rejected there.)
     Pure page-side state; the kernel keeps compositing while hidden
     (mailbox frames, bounded cost).

     Serve from the repo root — SharedArrayBuffer needs the COOP/COEP
     headers serve.js sends:   node serve.js .   then open /os/os.html  -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>gucOS</title>
<link rel="stylesheet" href="../vendor/xterm/xterm.css">
<style>
  html, body { height: 100%; margin: 0; background: #0d0d1a; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #status {
    font: 12px 'Menlo', 'Consolas', monospace; color: #557755;
    padding: 2px 8px; white-space: nowrap; overflow: hidden;
  }
  #status.error { color: #cc5555; }
  /* VT tabs (todos/0022): the primary, discoverable switch — one tab per
     VT, browser-tab styling. Ctrl+Alt+F1/F2 (or 1/2) are quiet aliases. */
  #vtbar {
    display: flex; gap: 2px; padding: 6px 8px 0;
    border-bottom: 1px solid #333355;
  }
  .vttab {
    font: 12px 'Menlo', 'Consolas', monospace; color: #8888a8;
    cursor: pointer; user-select: none; padding: 5px 18px;
    background: #16162a; border: 1px solid #333355; border-bottom: none;
    border-radius: 6px 6px 0 0; position: relative; top: 1px;
  }
  .vttab:hover { color: #c0c0d8; }
  .vttab.active {
    color: #e0e0f0; background: #22223a; border-color: #4a4a77;
  }
  /* The desktop (todos/WM.md): the kernel composites windows onto this
     canvas in its worker; the page only forwards raw input. Natural-size
     canvas (no CSS scaling) keeps event offsets == screen coordinates.
     The screen tracks the pane (todos/0023: full-viewport VT2, 1 CSS px =
     1 screen px); overflow hidden covers the resize transient while the
     worker's canvas commit lags the layout. */
  #desktop { flex: 1; min-height: 0; display: flex; justify-content: center;
             align-items: center; background: #06131a; overflow: hidden; }
  /* Host-file drop target highlight (todos/0067): while a drag hovers the
     desktop pane, an inset ring says "this lands in ~/Desktop". */
  #desktop.droptarget { box-shadow: inset 0 0 0 3px #5599dd; }
  #screen { outline: none; display: block; }
  #terminal { flex: 1; min-height: 0; padding: 4px; }
  /* VTs: exactly one of tty/desktop is visible (todos/0022). */
  body[data-vt="1"] #desktop { display: none; }
  body[data-vt="2"] #terminal { display: none; }
  /* Boot guard screen — two-tab lock (todos/0045: retry re-attempts) and
     the WebGPU requirement (todos/0055: no retry — the compositor IS
     WebGPU, no fallback) — shown INSTEAD of the VT panes. */
  #guard { flex: 1; display: none; flex-direction: column; gap: 14px;
           align-items: center; justify-content: center; text-align: center;
           font: 14px 'Menlo', 'Consolas', monospace; color: #c0c0d8; }
  #guard button {
    font: 13px 'Menlo', 'Consolas', monospace; color: #e0e0f0;
    background: #22223a; border: 1px solid #4a4a77; border-radius: 6px;
    padding: 6px 22px; cursor: pointer;
  }
  #guard button:hover { background: #2c2c4a; border-color: #6a6aa7; }
  body[data-guard] #guard { display: flex; }
  body[data-guard] #vtbar, body[data-guard] #terminal,
  body[data-guard] #desktop { display: none; }
</style>
</head>
<body data-vt="1">
<div id="wrap">
  <div id="vtbar">
    <span id="vt1tab" class="vttab active" title="the tty, VT1 (Ctrl+Alt+F1)">Terminal</span>
    <span id="vt2tab" class="vttab" title="the desktop, VT2 (Ctrl+Alt+F2). Ctrl+Alt+Tab cycles windows, +Shift for previous (todos/0032); Ctrl+Esc opens the Start menu (todos/0078)">Desktop</span>
  </div>
  <div id="desktop"><canvas id="screen" width="800" height="500" tabindex="0"></canvas></div>
  <div id="terminal"></div>
  <div id="guard">
    <div id="guardMsg">gucOS is already running in another tab.<br>
         Close that tab, then retry — the lock frees when it closes.</div>
    <button id="guardRetry">Retry</button>
  </div>
  <div id="status">booting…</div>
</div>
<script src="../vendor/xterm/xterm.js"></script>
<script src="../vendor/xterm/xterm-addon-fit.js"></script>
<!-- host.js on the page ONLY for createAudioReceiver (todos/0017): the
     mixer's output ring plays through the same Web Audio path standalone
     pages use. The page stays a dumb bridge — no other host.js use here. -->
<script src="../host.js"></script>
<script>
'use strict';

var statusEl = document.getElementById('status');
function status(msg, isError) {
  statusEl.textContent = msg;
  statusEl.className = isError ? 'error' : '';
}

if (typeof SharedArrayBuffer === 'undefined') {
  status('SharedArrayBuffer unavailable — serve this page with COOP/COEP headers (node serve.js .)', true);
  throw new Error('no SAB');
}

var term = new Terminal({
  cursorBlink: true,
  // Program stdout arrives raw (the kernel stays out of the output data
  // plane — no OPOST pass), so let xterm treat bare \n as \r\n.
  convertEol: true,
  fontSize: 14,
  fontFamily: "'Menlo', 'Consolas', 'Courier New', monospace",
  theme: { background: '#0d0d1a', foreground: '#c0c0d8', cursor: '#c0c0d8' },
});
var fitAddon = new FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
fitAddon.fit();

var kernel = new Worker('kernel-worker.js');

term.onData(function (data) { kernel.postMessage({ type: 'input', data: data }); });
term.onResize(function (sz) { kernel.postMessage({ type: 'resize', cols: sz.cols, rows: sz.rows }); });
window.addEventListener('resize', function () {
  if (vt === 1) fitAddon.fit();
  else scheduleScreenSync();   // dynamic screen resolution (todos/0023)
});

// The desktop (todos/WM.md): hand the canvas to the kernel worker (the
// compositor runs THERE — this page stays a dumb bridge) and forward raw
// input. DOM events don't structured-clone, so ship plain objects; the
// kernel side re-shapes them for SDL_WEB's mappers.
var screen = document.getElementById('screen');
var offscreen = screen.transferControlToOffscreen();
kernel.postMessage({ type: 'wm-canvas', canvas: offscreen }, [offscreen]);
function wmSend(ev) { kernel.postMessage({ type: 'wm-input', ev: ev }); }

// Dynamic screen resolution (todos/0023): on VT2 the screen tracks the
// #desktop pane — natural canvas size only (1 CSS px = 1 screen px, DPR
// deliberately ignored: a scale factor would taint every coordinate path).
// A transferred canvas can't be resized from the page, so the pane size
// rides {type:'screen-resize'} and the WORKER resizes the OffscreenCanvas +
// re-calls wmSetScreen (-> EV_SCREEN to the wm, kernel position clamp).
// VT2 entry syncs immediately (the pane is measurable only while visible);
// live window resizes are debounced — every send costs a wm taskbar re-lay.
var screenSent = { w: 800, h: 500 };   // the boot-time canvas attributes
window.__osScreen = { w: 800, h: 500 };   // agent probe: last size sent
var screenSyncTimer = null;
function syncScreenSize() {
  if (vt !== 2) return;
  var pane = document.getElementById('desktop');
  var w = pane.clientWidth, h = pane.clientHeight;
  if (w <= 0 || h <= 0) return;                          // hidden/degenerate
  if (w === screenSent.w && h === screenSent.h) return;
  screenSent = { w: w, h: h };
  window.__osScreen = { w: w, h: h };
  kernel.postMessage({ type: 'screen-resize', w: w, h: h });
}
function scheduleScreenSync() {
  if (screenSyncTimer) clearTimeout(screenSyncTimer);
  screenSyncTimer = setTimeout(function () { screenSyncTimer = null; syncScreenSize(); }, 150);
}
function mods(e) {
  var out = {};
  ['Shift', 'Control', 'Alt', 'Meta', 'AltGraph', 'CapsLock', 'NumLock', 'ScrollLock']
    .forEach(function (k) { out[k] = e.getModifierState ? e.getModifierState(k) : false; });
  return out;
}
// Pointer lock (todos/0018): the kernel sends {type:'pointer-lock', wanted}
// when the focused surface wants relative mouse, and RE-SENDS wanted=true
// when a client-area click lands on it (the kernel hit-tests; the page can't)
// — that click is the user gesture the Pointer Lock API needs, so the
// request below succeeds then and no-ops silently otherwise (e.g. at app
// startup with no gesture; the browser-enforced ESC unlock is re-taken by
// the next client click the same way). Transitions are reported back so the
// kernel flips between relative and absolute routing.
var ptrLockWanted = false;
function ptrLocked() { return document.pointerLockElement === screen; }
// Cursor shapes (todos/0105): the kernel derives the effective cursor per
// pointer move (chrome resize cursors overlaid on the hovered surface's own
// SDL_SetCursor shape) and posts {type:'cursor', shape}; we map it to a CSS
// `cursor` name on the desktop canvas. Index is the SDL_SystemCursor wire
// value; -1 (hidden) -> 'none'. Kept in sync with host.js's CURSOR_CSS.
var CURSOR_CSS = [
  'default', 'text', 'wait', 'crosshair', 'progress',
  'nwse-resize', 'nesw-resize', 'ew-resize', 'ns-resize', 'move',
  'not-allowed', 'pointer', 'nw-resize', 'n-resize', 'ne-resize',
  'e-resize', 'se-resize', 's-resize', 'sw-resize', 'w-resize'];
function applyCursor(shape) {
  // Never fight the browser's own cursor while the pointer is locked (there
  // is no cursor then); the kernel already sends -1, but guard anyway.
  screen.style.cursor = shape === -1 ? 'none' : (CURSOR_CSS[shape] || 'default');
  window.__osCursor = shape;   // agent probe
}
document.addEventListener('pointerlockchange', function () {
  wmSend({ kind: 'lockchange', active: ptrLocked() });
  window.__osPtrLock = ptrLocked();   // agent probe
});
screen.addEventListener('mousedown', function (e) {
  screen.focus();
  // t: the event timestamp — the kernel's title double-click detection
  // (todos/0025) measures the real inter-click gap, not worker latency.
  wmSend({ kind: 'down', x: e.offsetX, y: e.offsetY, button: e.button, t: e.timeStamp });
  e.preventDefault();
});
screen.addEventListener('mouseup', function (e) {
  wmSend({ kind: 'up', x: e.offsetX, y: e.offsetY, button: e.button });
});
screen.addEventListener('mousemove', function (e) {
  if (ptrLocked()) {
    wmSend({ kind: 'move', locked: 1, dx: e.movementX, dy: e.movementY, buttons: e.buttons });
    return;
  }
  wmSend({ kind: 'move', x: e.offsetX, y: e.offsetY, buttons: e.buttons });
});
screen.addEventListener('wheel', function (e) {
  wmSend({ kind: 'wheel', x: e.offsetX, y: e.offsetY, deltaX: e.deltaX, deltaY: e.deltaY, deltaMode: e.deltaMode });
  e.preventDefault();
}, { passive: false });
screen.addEventListener('contextmenu', function (e) { e.preventDefault(); });
screen.addEventListener('keydown', function (e) {
  wmSend({ kind: 'key', down: true, code: e.code, key: e.key, repeat: e.repeat, mods: mods(e) });
  e.preventDefault();
});
screen.addEventListener('keyup', function (e) {
  wmSend({ kind: 'key', down: false, code: e.code, key: e.key, repeat: e.repeat, mods: mods(e) });
  e.preventDefault();
});

// Host-file drop (todos/0067): drag a file from the host onto the desktop
// and it lands in /root/Desktop, where the wm's icon grid picks it up
// within ~1s (no reboot). The page stays a dumb bridge: read the bytes,
// post {type:'drop-file'} per file with the ArrayBuffer TRANSFERRED
// (zero-copy); ALL policy (name sanitizing, collisions, size cap, the
// actual fs write) lives in the kernel worker. Listeners sit on the
// #desktop pane so the whole VT2 surface is a target; dragover's
// preventDefault is what makes the drop legal.
var desktopPane = document.getElementById('desktop');
desktopPane.addEventListener('dragover', function (e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
  desktopPane.classList.add('droptarget');
});
desktopPane.addEventListener('dragleave', function () {
  desktopPane.classList.remove('droptarget');
});
desktopPane.addEventListener('drop', function (e) {
  e.preventDefault();
  desktopPane.classList.remove('droptarget');
  var files = (e.dataTransfer && e.dataTransfer.files) || [];
  Array.prototype.forEach.call(files, function (f) {
    f.arrayBuffer().then(function (ab) {
      kernel.postMessage({ type: 'drop-file', name: f.name, bytes: ab }, [ab]);
    });
  });
});

// VTs (todos/0022): Linux-console semantics — VT1 = the xterm tty, VT2 = the
// desktop; the page shows exactly one (body[data-vt] CSS above). The PRIMARY
// switch is the Terminal/Desktop tab bar (discoverable; hotkeys are OS-
// contested); Ctrl+Alt+F1/F2 and Ctrl+Alt+1/2 remain as aliases. Page-side
// state ONLY: the kernel keeps compositing while hidden (frames are mailbox
// — bounded cost, zero protocol change), so VT1 stays fully usable when the
// desktop stack is broken — the escape hatch is the point. Pointer lock is
// dropped on leaving VT2 (and lock requests are gated to VT2); it re-arms
// per 0018 on the next client click.
var vt = 1;
window.__osVt = 1;   // agent probe
// Desktop-by-default (todos/0070): a healthy boot auto-switches to VT2 at
// 'ready' — but only if the user hasn't already picked a VT themselves
// (tab click, hotkey, or the __osVtSwitch probe) while the boot streamed.
var vtTouched = false;
function setVt(n) {
  n = n === 2 ? 2 : 1;
  if (n === vt) return;
  if (vt === 2) {
    if (ptrLocked() && document.exitPointerLock) document.exitPointerLock();
    // Release the switch chord's modifiers into the focused surface: their
    // keyups will land on VT1's xterm, so without this the app would see
    // Ctrl/Alt held forever (the stuck-modifier class every console
    // switcher has to handle).
    [['ControlLeft', 'Control'], ['AltLeft', 'Alt']].forEach(function (k) {
      wmSend({ kind: 'key', down: false, code: k[0], key: k[1], repeat: false, mods: {} });
    });
  }
  vt = n;
  window.__osVt = n;   // agent probe
  document.body.setAttribute('data-vt', String(n));
  document.getElementById('vt1tab').className = 'vttab' + (n === 1 ? ' active' : '');
  document.getElementById('vt2tab').className = 'vttab' + (n === 2 ? ' active' : '');
  // Re-fit AFTER unhiding — xterm can't measure a display:none pane; same
  // for the desktop pane (todos/0023: the screen syncs to it on VT2 entry).
  if (n === 1) { fitAddon.fit(); term.focus(); }
  else { syncScreenSize(); screen.focus(); }
}
// Every USER-driven switch path goes through here so a choice made during
// boot sticks (the 0070 auto-switch respects it). Internal forced switches
// (boot-error, halt, the ready auto-switch) call setVt directly.
function userSetVt(n) { vtTouched = true; setVt(n); }
window.__osVtSwitch = userSetVt;   // agent probe (tests/browser/os-vt.mjs)
document.getElementById('vt1tab').addEventListener('click', function () { userSetVt(1); });
document.getElementById('vt2tab').addEventListener('click', function () { userSetVt(2); });
window.addEventListener('keydown', function (e) {
  if (!e.ctrlKey || !e.altKey) return;
  var n = (e.code === 'F1' || e.code === 'Digit1') ? 1
        : (e.code === 'F2' || e.code === 'Digit2') ? 2 : 0;
  if (!n) return;
  e.preventDefault();
  e.stopPropagation();   // capture phase: beats xterm's and the canvas's handlers
  userSetVt(n);
}, true);

// Agent/test probe (OS.md "agent-friendly by construction"): every tty
// output byte also lands in window.__osOut, and __osState tracks the boot,
// so a driver (tests/browser/os-boots.mjs, or any agent) can poll instead
// of scraping the xterm buffer.
window.__osOut = '';
window.__osState = 'booting';
window.__osLogs = [];   // boot-log/kernel lines (agent probe)
var outDecoder = new TextDecoder();

kernel.onmessage = function (e) {
  var m = e.data;
  switch (m.type) {
    case 'out':
      term.write(m.bytes);
      window.__osOut += outDecoder.decode(m.bytes, { stream: true });
      break;
    case 'boot-log':
      status(m.msg);
      window.__osLogs.push(m.msg);
      if (window.__osLogs.length > 200) window.__osLogs.shift();
      break;
    case 'boot-error':
      status('boot failed', true);
      window.__osState = 'error';
      window.__osBootErr = m.msg;   // agent probe: the full failure text
      setVt(1);   // the escape hatch surfaces the failure (todos/0022)
      term.write('\r\n\x1b[31mboot failed:\x1b[0m\r\n' + m.msg.replace(/\n/g, '\r\n') + '\r\n');
      break;
    // Two-tab boot guard (todos/0045): the kernel worker takes a Web Lock on
    // the image pair BEFORE mounting OPFS; a losing tab lands here with
    // nothing mounted. Retry (below) re-attempts — the lock frees when the
    // winning tab closes. No steal in v1.
    case 'boot-locked':
      status('already running in another tab', true);
      window.__osState = 'locked';   // agent probe (tests/browser/os-boots.mjs)
      document.getElementById('guardRetry').style.display = '';
      document.body.setAttribute('data-guard', '1');
      break;
    // WebGPU boot guard (todos/0055): the kernel worker found no adapter/
    // device — the compositor is WebGPU with NO fallback (decision log
    // logs/2026-07-09/webgpu-mvu-direction.md), so the boot stops loudly
    // before mounting anything. No retry: a reload won't grow a GPU.
    case 'boot-nogpu':
      status('WebGPU unavailable — cannot boot', true);
      window.__osState = 'nogpu';    // agent probe (tests/browser/os-boots.mjs)
      document.getElementById('guardMsg').innerHTML =
        'gucOS requires WebGPU — the desktop compositor renders with it<br>' +
        '(no fallback). Use a browser with WebGPU available in workers,<br>' +
        'e.g. current Chrome or Edge.';
      document.getElementById('guardRetry').style.display = 'none';
      document.body.setAttribute('data-guard', '1');
      break;
    case 'ready':
      status('running (image: ' + m.mode + ') — files persist in OPFS');
      window.__osState = 'ready';
      kernel.postMessage({ type: 'resize', cols: term.cols, rows: term.rows });
      // Desktop as the default tab (todos/0070): the boot log streamed on
      // VT1; a HEALTHY boot now lands on the desktop. boot-error/halt never
      // race this ('ready' fires exactly once, on success), and a manual
      // switch during boot wins — the tty stays one click away either way.
      if (!vtTouched) setVt(2);
      else if (vt === 1) term.focus();
      break;
    case 'halt': {
      var sig = m.status & 0x7f;
      var code = sig ? 128 + sig : (m.status >> 8) & 0xff;
      status('halted (exit ' + code + ') — reload to reboot', true);
      window.__osState = 'halted:' + code;
      setVt(1);   // the halt notice lives on the tty (todos/0022)
      term.write('\r\n\x1b[33m[system halted — reload the page to reboot]\x1b[0m\r\n');
      break;
    }
    // Relative mouse (todos/0018): the kernel's wanted state / lock re-offer
    // (see the pointer-lock comment above the mousedown handler).
    case 'pointer-lock':
      ptrLockWanted = !!m.wanted;
      window.__osPtrLockWanted = ptrLockWanted;   // agent probe
      if (ptrLockWanted) window.__osPtrLockOffers = (window.__osPtrLockOffers || 0) + 1;   // agent probe
      if (!ptrLockWanted && ptrLocked() && document.exitPointerLock) {
        document.exitPointerLock();
      } else if (ptrLockWanted && vt === 2 && !ptrLocked() && screen.requestPointerLock) {
        // Succeeds inside the transient activation of the client click the
        // kernel just hit-tested; rejects quietly without a gesture.
        try {
          var lockP = screen.requestPointerLock();
          if (lockP && lockP.catch) lockP.catch(function () {});
        } catch (err) { /* no gesture yet */ }
      }
      break;
    // Cursor shape (todos/0105): apply the kernel's effective cursor to the
    // desktop canvas. Ignore while pointer-locked (no cursor exists then).
    case 'cursor':
      if (!ptrLocked()) applyCursor(m.shape | 0);
      break;
    // The audio mixer's output ring (todos/0017): play it with host.js's
    // createAudioReceiver — one synthetic device, resumed on the first user
    // gesture (browser autoplay policy gates AudioContext until then).
    case 'audio': {
      var receiver = createAudioReceiver({ sharedBuffer: m.sab, bufferSize: m.bufferSize });
      receiver.handleMessage({ type: 'audio-open', id: 1, freq: m.freq, format: m.format, channels: m.channels });
      var resumeAudio = function () {
        receiver.handleMessage({ type: 'audio-pause', id: 1, pause: false });
        window.__osAudio = 'playing';   // agent probe
      };
      ['mousedown', 'keydown', 'touchstart'].forEach(function (evName) {
        window.addEventListener(evName, resumeAudio, { once: true, capture: true });
      });
      window.__osAudio = 'ready';       // agent probe: ring received, awaiting gesture
      window.__osAudioSab = m.sab;      // agent probe: tests read queuedBytes
      break;
    }
  }
};
kernel.onerror = function (e) {
  status('kernel worker error: ' + e.message, true);
};

// Two-tab boot guard retry (todos/0045): hide the guard optimistically; if
// the lock is still held the worker answers with another boot-locked and it
// comes right back. The worker ignores retries while a boot is in flight.
document.getElementById('guardRetry').addEventListener('click', function () {
  document.body.removeAttribute('data-guard');
  status('booting…');
  window.__osState = 'booting';
  kernel.postMessage({ type: 'boot-retry' });
});
</script>
</body>
</html>
